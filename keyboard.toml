[keyboard]
name = "Mini-numpad-3key"
chip = "nrf52840"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
product_name = "Mini 3-Key Pad"

[matrix]
matrix_type = "direct_pin"
direct_pins = [["P0_29", "P0_02", "P0_09"]]
direct_pin_low_active = true

[layout]
rows = 1
cols = 3
map = "(0,0) (0,1) (0,2)"

[[keymap.layer]]
keys = "A B C"

[host]
vial_enabled = true
